title: 김지율 | Infrastructure Portfolio
description: 시스템·클라우드 인프라 엔지니어 김지율의 프로젝트와 기술 기록
author: 김지율

remote_theme: sighingnow/jekyll-gitbook

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

url: ""
baseurl: ""

markdown: kramdown
syntax_highlighter_style: colorful

toc:
  enabled: true
  h_min: 1
  h_max: 3

sharing:
  facebook: false
  twitter: false
  all: []

collections:
  pages:
    output: true
    permalink: /:collection/:name/

ordered_collections:
  - pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
